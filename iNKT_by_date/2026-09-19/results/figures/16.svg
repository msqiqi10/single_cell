  <g id="text_22">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.32" y="46.636406" transform="rotate(-0 40.32 46.636406)">Core signature changes do not imply a full killing pathway</text>
  </g>
  <g id="text_23">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #444444" x="40.32" y="73.918125" transform="rotate(-0 40.32 73.918125)">Two reproducible local core signals; the broader E1 signature is not significant.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.32" y="613.098516" transform="rotate(-0 40.32 613.098516)">Exploratory transcriptional results; one sample label per tissue x condition; no animal-level inference.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="40.32" y="632.448" transform="rotate(-0 40.32 632.448)">Huang et al. 2024, PAGER-scFGA, Fig. 5; doi:10.3389/fbinf.2024.1336135; Borra et al. 2026, GAFA, Sec. 3.5 / Fig. 4c; doi:10.3390/biology15070588</text>
  </g>
  <g id="text_26">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end" x="1111.68" y="632.448" transform="rotate(-0 1111.68 632.448)">16</text>
  </g>
  <g id="text_27">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 162.353125)">B  Complementary evidence from the same dataset</text>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 177.39)"/>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 200.029531)">Bone marrow C4 core: +0.086; q = 0.025</text>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 219.053125)">Spleen C3 core: -0.023; q = 0.0015</text>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 237.953125)">Both: same direction in all 5 QC resamples</text>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 252.99)"/>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 277.109375)">Stable-cluster effects: +0.111 and -0.022</text>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 294.653125)">Original-cell overlap: 98.7% and 99.5%</text>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 309.69)"/>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 332.453125)">E1 (+Ctla2a): q = 0.93 and 0.53</text>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(633.6 351.353125)">Killing-related GO terms: no q &lt;= 0.05</text>
  </g>
  <g id="text_28">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(92.16 498.9)">The evidence supports a localized core-effector transcriptional shift.</text>
   <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(92.16 518.4)">It does not establish increased/decreased killing activity or coordinated activation of a full cytotoxic pathway.</text>
  </g>
 </g>
